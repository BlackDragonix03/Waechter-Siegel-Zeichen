name: Pakete bauen

# Baut die Windows-Exe und die Android-APK und legt sie als Artefakte ab
# (Actions -> Lauf auswählen -> Artefakte). Bei einem Tag v* werden sie nicht
# automatisch veröffentlicht; das Veröffentlichen bleibt eine bewusste Entscheidung.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Exe bauen
        working-directory: desktop
        run: |
          npm install
          npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: Waechter-Siegelwerkstatt-Windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error

  android-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Web-App sammeln
        run: node scripts/build-web.js
      - name: Android-Projekt erzeugen
        run: |
          mkdir android-app
          cp android/package.json android/capacitor.config.json android-app/
          cd android-app
          npm install
          npx cap add android
          npx cap sync android
      - name: APK bauen
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Waechter-Siegelwerkstatt-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Waechter-Siegelwerkstatt-Android-apk
          path: Waechter-Siegelwerkstatt-debug.apk
          if-no-files-found: error
