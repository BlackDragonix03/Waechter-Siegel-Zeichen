name: NetGuard bauen

# Baut die NetGuard-Exe (Windows) und legt sie als Artefakt ab.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['netguard/**', 'build-netguard-exe.bat', '.github/workflows/netguard.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest discover -s tests
        working-directory: netguard

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Programme laden
        working-directory: netguard
        run: pip install -r requirements.txt pyinstaller
      - name: Symbol erzeugen
        working-directory: netguard
        run: python scripts\make_icon.py build\netguard.ico
      - name: Exe bauen
        working-directory: netguard
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NetGuard --icon build\netguard.ico
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtCharts --exclude-module PySide6.QtPdf
          netguard.py
      - name: MCP-Konsolen-Exe bauen
        working-directory: netguard
        run: >
          python -m PyInstaller --noconfirm --onefile --console --name NetGuard-MCP --icon build\netguard.ico
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtCharts --exclude-module PySide6.QtPdf
          netguard.py
      - uses: actions/upload-artifact@v4
        with:
          name: NetGuard-Windows-exe
          path: |
            netguard/dist/NetGuard.exe
            netguard/dist/NetGuard-MCP.exe
          if-no-files-found: error
